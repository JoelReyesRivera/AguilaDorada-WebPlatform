name: IndexNow Ping

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-sitemap-lastmod:
    runs-on: ubuntu-latest
    if: github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar <lastmod> de las páginas que cambiaron en este push
        # Compara solo contra el commit anterior de este push (no todo el
        # historial), así que si una página no cambió, su lastmod no se
        # toca. El mapeo ruta->URL es manual y a propósito: si se agrega
        # una página nueva al sitemap, hay que sumarla aquí también.
        run: |
          python3 <<'PY'
          import re
          import subprocess
          from datetime import datetime, timezone

          before = "${{ github.event.before }}"
          after = "${{ github.sha }}"
          changed = subprocess.run(
              ["git", "diff", "--name-only", before, after],
              capture_output=True, text=True, check=True
          ).stdout.splitlines()

          PATH_TO_URL = {
              "index.html": "https://aguiladorada.org/",
              "pages/servicios.html": "https://aguiladorada.org/pages/servicios.html",
              "pages/programas-comunitarios.html": "https://aguiladorada.org/pages/programas-comunitarios.html",
              "pages/nosotros.html": "https://aguiladorada.org/pages/nosotros.html",
              "pages/eventos-pasados.html": "https://aguiladorada.org/pages/eventos-pasados.html",
              "pages/contacto.html": "https://aguiladorada.org/pages/contacto.html",
              "pages/voluntariado.html": "https://aguiladorada.org/pages/voluntariado.html",
          }

          urls_to_touch = {PATH_TO_URL[f] for f in changed if f in PATH_TO_URL}
          if not urls_to_touch:
              print("Ninguna página del sitemap cambió en este push; no se toca sitemap.xml.")
          else:
              today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              with open("sitemap.xml", encoding="utf-8") as f:
                  content = f.read()

              def replace_lastmod(match):
                  block = match.group(0)
                  if any(f"<loc>{u}</loc>" in block for u in urls_to_touch):
                      return re.sub(r"<lastmod>.*?</lastmod>", f"<lastmod>{today}</lastmod>", block)
                  return block

              new_content = re.sub(r"<url>.*?</url>", replace_lastmod, content, flags=re.DOTALL)
              if new_content != content:
                  with open("sitemap.xml", "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Actualizado lastmod a {today} para: {sorted(urls_to_touch)}")
              else:
                  print("Las URLs cambiadas no están en sitemap.xml (o están comentadas); no se toca nada.")
          PY

      - name: Commitear sitemap.xml si cambió
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sin cambios en sitemap.xml"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Actualizar lastmod del sitemap tras cambios de contenido"
            git push
          fi

  ping-indexnow:
    needs: update-sitemap-lastmod
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send IndexNow Ping
        # PRIVACIDAD AÚN NO DESPLEGADA: pages/privacidad.html no está en urlList a propósito.
        # Agrégala ahí (dentro del JSON de abajo) cuando la página esté lista para publicarse.
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "aguiladorada.org",
              "key": "cf3968cf08a949beb976d7c0f429976f",
              "keyLocation": "https://aguiladorada.org/cf3968cf08a949beb976d7c0f429976f.txt",
              "urlList": [
                "https://aguiladorada.org/",
                "https://aguiladorada.org/pages/servicios.html",
                "https://aguiladorada.org/pages/nosotros.html",
                "https://aguiladorada.org/pages/eventos-pasados.html",
                "https://aguiladorada.org/pages/contacto.html",
                "https://aguiladorada.org/pages/voluntariado.html"
              ]
            }'
